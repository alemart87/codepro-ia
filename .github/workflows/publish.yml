# Build and Publish CodePro Binaries
name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.2)'
        required: true
        type: string

env:
  BUN_VERSION: '1.3.6'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          cd packages/opencode
          bun run build --single
        env:
          OPENCODE_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepro-${{ matrix.target }}
          path: packages/opencode/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/opencode
          # Update version from release tag
          VERSION=${{ github.event.inputs.version || github.event.release.tag_name }}
          npm version $VERSION --no-git-tag-version --allow-same-version || true
          npm publish --access public
