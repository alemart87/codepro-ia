# Build and Publish CodePro Binaries
# Este workflow compila binarios para todas las plataformas y los publica a npm

name: Build and Publish

on:
  # Se ejecuta cuando creas un release en GitHub
  release:
    types: [published]
  
  # También se puede ejecutar manualmente
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.2)'
        required: true
        type: string

env:
  BUN_VERSION: '1.3.6'

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: win32-x64
            
          # Linux
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            
          # macOS
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install
        working-directory: ./opencode

      - name: Build binary
        run: |
          cd packages/opencode
          OPENCODE_VERSION=${{ github.event.inputs.version || github.event.release.tag_name }} bun run build --single
        working-directory: ./opencode
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepro-${{ matrix.target }}
          path: ./opencode/packages/opencode/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Publicar cada binario como paquete separado
          for dir in ./dist/codepro-*/; do
            if [ -d "$dir" ]; then
              echo "Publishing $dir"
              cd "$dir"
              npm publish --access public
              cd -
            fi
          done

      - name: Update main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd ./opencode/packages/opencode
          npm publish --access public
